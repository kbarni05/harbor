name: Windows installer

on:
  workflow_dispatch:
    inputs:
      existing_build_run_id:
        description: Repackage a preserved Windows build
        type: string
        default: ""
  workflow_call:
    inputs:
      existing_build_run_id:
        type: string
        default: ""

permissions:
  contents: read
  actions: read

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 90
    env:
      CARGO_BUILD_JOBS: 4
      CACHE_ON_FAILURE: "true"
      NODE_OPTIONS: --max-old-space-size=6144
      # Match the previously published cloud-sync installer. This build explicitly
      # omits the unavailable extension runtime instead of shipping an unverified one.
      HARBOR_CAPSTAN_OPTIONAL: "1"
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Declare the unavailable extension runtime
        run: |
          $path = Join-Path $env:RUNNER_TEMP 'harbor-extension-runtime-unavailable'
          if (Test-Path $path) { throw 'Expected an absent extension-runtime source path' }
          "HARBOR_CAPSTAN_SRC=$path" | Add-Content $env:GITHUB_ENV

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - uses: pnpm/action-setup@v4
        with:
          version: 11.9.0

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - uses: Swatinem/rust-cache@v2
        if: inputs.existing_build_run_id == ''
        with:
          workspaces: src-tauri
          cache-on-failure: "true"

      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile

      - name: Recover verified libmpv from the published installer
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = 'Stop'
          $previousName = 'Harbor_0.9.127_cloud-settings-sync_no-extension-runtime_x64-setup.exe'
          $download = Join-Path $env:RUNNER_TEMP 'harbor-previous-installer'
          $downloadOutput = @(& gh release download v0.9.127-cloud-sync.1 --repo $env:GITHUB_REPOSITORY --pattern $previousName --dir $download 2>&1)
          if ($LASTEXITCODE -ne 0) {
            $message = ($downloadOutput -join "`n").Replace('%', '%25').Replace("`r", '%0D').Replace("`n", '%0A')
            Write-Host "::error title=Previous installer download::$message"
            exit 1
          }
          $previous = Join-Path $download $previousName
          $expectedInstaller = 'c5f295521b259d3cec98d6ad06ee12e8024816158ca2c5402d086ea3272d255e'
          if ((Get-FileHash $previous -Algorithm SHA256).Hash.ToLowerInvariant() -ne $expectedInstaller) {
            throw 'Previous installer checksum mismatch'
          }
          $extracted = Join-Path $download 'extracted'
          7z x -y $previous "-o$extracted"
          if ($LASTEXITCODE -ne 0) { throw 'Previous installer extraction failed' }
          # The source downloader's pin is stale. Preserve it and reuse the DLL
          # authenticated by the immutable previous-installer checksum above.
          # Also require agreement with the upstream release's published digest.
          $verified = @(Get-ChildItem $extracted -Recurse -Filter 'libmpv-2.dll')
          if ($verified.Count -ne 1) { throw 'Previous installer must contain exactly one libmpv DLL' }
          $dllHash = (Get-FileHash $verified[0].FullName -Algorithm SHA256).Hash.ToLowerInvariant()
          $publishedDigest = & gh api repos/harborstremio/harbor/releases/tags/mpvdll --jq '.assets[] | select(.name=="libmpv-2.dll") | .digest'
          if ($LASTEXITCODE -ne 0 -or $publishedDigest -ne "sha256:$dllHash") {
            throw 'Recovered DLL does not match the official release asset digest'
          }
          Copy-Item $verified[0].FullName src-tauri/libmpv/libmpv-2.dll
          "libmpv verified through the previous installer checksum and official asset digest; SHA-256: $dllHash" | Add-Content $env:GITHUB_STEP_SUMMARY
          Remove-Item $download -Recurse -Force

      - name: Prepare verified native assets
        run: |
          foreach ($script in @('setup:binaries', 'setup:mpv', 'setup:fonts')) {
            $output = @(& pnpm run $script 2>&1)
            $code = $LASTEXITCODE
            $output | ForEach-Object { Write-Host $_ }
            if ($code -ne 0) {
              $message = ($output | Select-Object -Last 25) -join "`n"
              $message = $message.Replace('%', '%25').Replace("`r", '%0D').Replace("`n", '%0A')
              Write-Host "::error title=${script}::$message"
              exit $code
            }
          }

      - name: Check combined frontend types
        run: pnpm run typecheck

      - name: Verify combined custom regression tests
        run: >-
          node --experimental-loader ./scripts/node-test-loader.mjs --test
          tests/cloud-settings-sync.test.ts tests/hungarian-locale.test.ts
          tests/preferred-meta.test.ts tests/content-advisory.test.ts
          tests/playback-stats.test.ts tests/reported-player-regressions.test.ts
          tests/general-performance-regressions.test.ts tests/hdr-dolby-vision-policy.test.ts
          tests/settings-page-preferences.test.ts tests/subtitle-addon-reach.test.ts
          tests/subtitle-picker-all-tracks.test.ts tests/performance-ux-regressions.test.ts
          tests/mpv-ui-backend-contract.test.ts tests/tray-and-xray-performance.test.ts
          tests/skip-and-trickplay-regressions.test.ts tests/visibility.test.ts
          tests/player-buffer-policy.test.ts tests/mpv-cache-retention.test.ts
          tests/playback-critical-path.test.ts tests/subtitle-fetch-selection.test.ts
          tests/subtitle-wyzie-language.test.ts tests/settings-translations.test.ts
          tests/i18n-languages.test.ts tests/hdr-overlay-providers.test.mjs
          tests/watchlist-identity.test.mjs

      - name: Verify preserved build source
        if: inputs.existing_build_run_id != ''
        env:
          GH_TOKEN: ${{ github.token }}
          EXISTING_BUILD_RUN_ID: ${{ inputs.existing_build_run_id }}
        run: |
          if ($env:EXISTING_BUILD_RUN_ID -notmatch '^[0-9]{1,20}$') { throw 'Expected a numeric run ID' }
          $run = & gh api "repos/$env:GITHUB_REPOSITORY/actions/runs/$env:EXISTING_BUILD_RUN_ID" | ConvertFrom-Json
          if ($LASTEXITCODE -ne 0) { throw 'Could not read preserved build provenance' }
          $changed = @(& git diff --name-only $run.head_sha HEAD)
          if ($LASTEXITCODE -ne 0) { throw 'Could not compare preserved build source' }
          if ($changed | Where-Object { $_ -notlike '.github/workflows/*' }) {
            throw 'Preserved application source differs from the current source'
          }
          "HARBOR_COMPILED_SOURCE=$($run.head_sha)" | Add-Content $env:GITHUB_ENV

      - name: Download preserved installer
        if: inputs.existing_build_run_id != ''
        uses: actions/download-artifact@v4
        with:
          name: windows-installer-build-output
          path: previous-build
          run-id: ${{ inputs.existing_build_run_id }}
          github-token: ${{ github.token }}

      - name: Recover compiled app and stage frontend resources
        if: inputs.existing_build_run_id != ''
        run: |
          $installers = @(Get-ChildItem previous-build -Filter '*.exe')
          if ($installers.Count -ne 1) { throw 'Expected exactly one preserved installer' }
          $extracted = Join-Path $env:RUNNER_TEMP 'harbor-preserved-build'
          7z x -y $installers[0].FullName "-o$extracted"
          if ($LASTEXITCODE -ne 0) { throw 'Preserved installer extraction failed' }
          $app = @(Get-ChildItem $extracted -Recurse -Force -File -Filter 'harbor.exe')
          if ($app.Count -ne 1) { throw 'Expected exactly one compiled app' }
          $release = 'src-tauri/target/x86_64-pc-windows-msvc/release'
          New-Item -ItemType Directory -Force $release | Out-Null
          Copy-Item $app[0].FullName "$release/harbor.exe"
          pnpm run build:desktop
          if ($LASTEXITCODE -ne 0) { throw 'Frontend resource staging failed' }

      - name: Declare packaging resources for this build
        run: |
          $config = Get-Content src-tauri/tauri.windows.conf.json -Raw | ConvertFrom-Json -AsHashtable
          # ResourcePaths stops iterating a map when it encounters an empty directory.
          # This explicitly optional build has no Capstan runtime to package.
          $config.bundle.resources['resources/capstan/'] = $null
          $path = Join-Path $env:RUNNER_TEMP 'harbor-windows-installer-config.json'
          $config | ConvertTo-Json -Depth 20 | Set-Content $path
          "HARBOR_INSTALLER_CONFIG=$path" | Add-Content $env:GITHUB_ENV

      - name: Check combined native Windows source
        if: inputs.existing_build_run_id == ''
        run: |
          $env:TAURI_CONFIG = Get-Content $env:HARBOR_INSTALLER_CONFIG -Raw
          $output = [System.Collections.Generic.Queue[string]]::new()
          & cargo check --manifest-path src-tauri/Cargo.toml --release --locked --target x86_64-pc-windows-msvc 2>&1 | ForEach-Object {
            $line = "$_"
            Write-Host $line
            $output.Enqueue($line)
            if ($output.Count -gt 60) { $null = $output.Dequeue() }
          }
          if ($LASTEXITCODE -ne 0) {
            $message = ($output -join "`n").Replace('%', '%25').Replace("`r", '%0D').Replace("`n", '%0A')
            Write-Host "::error title=Native Windows check::$message"
            exit $LASTEXITCODE
          }

      - name: Build Windows x64 NSIS installer
        run: |
          Write-Host "Logical processors: $([Environment]::ProcessorCount)"
          $output = [System.Collections.Generic.Queue[string]]::new()
          $command = if ($env:HARBOR_COMPILED_SOURCE) { 'bundle' } else { 'build' }
          $arguments = @('tauri', $command, '--config', $env:HARBOR_INSTALLER_CONFIG, '--target', 'x86_64-pc-windows-msvc', '--bundles', 'nsis')
          if ($command -eq 'build') { $arguments += @('--', '--locked') }
          & pnpm @arguments 2>&1 | ForEach-Object {
            $line = "$_"
            Write-Host $line
            $output.Enqueue($line)
            if ($output.Count -gt 80) { $null = $output.Dequeue() }
          }
          $code = $LASTEXITCODE
          if ($code -ne 0) {
            $message = ($output | Select-Object -Last 80) -join "`n"
            $message = $message.Replace('%', '%25').Replace("`r", '%0D').Replace("`n", '%0A')
            Write-Host "::error title=Windows build::$message"
            exit $code
          }

      - name: Preserve build output for packaging diagnostics
        uses: actions/upload-artifact@v4
        with:
          name: windows-installer-build-output
          path: src-tauri/target/x86_64-pc-windows-msvc/release/bundle/nsis/*.exe
          if-no-files-found: error
          retention-days: 3

      - name: Verify and prepare installer artifact
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          git diff --exit-code -- package.json pnpm-lock.yaml src-tauri/Cargo.lock
          if ($LASTEXITCODE -ne 0) { throw 'Build changed dependency manifests or lockfiles' }
          $version = (Get-Content src-tauri/tauri.conf.json -Raw | ConvertFrom-Json).version
          $releaseRoot = 'src-tauri/target/x86_64-pc-windows-msvc/release'
          $installers = @(Get-ChildItem "$releaseRoot/bundle/nsis" -Filter '*.exe')
          if ($installers.Count -ne 1) { throw 'Expected exactly one Windows installer' }
          $installer = $installers[0]
          foreach ($exe in @($installer.FullName, "$releaseRoot/harbor.exe")) {
            $actual = (Get-Item $exe).VersionInfo.FileVersion
            if ($actual -ne $version -and $actual -ne "$version.0") {
              Write-Host "::error title=Installer version validation::Wrong EXE version: $actual (expected $version)"
              throw "Wrong EXE version: $actual (expected $version)"
            }
          }
          $extracted = Join-Path $env:RUNNER_TEMP 'harbor-installer-verification'
          7z x -y $installer.FullName "-o$extracted"
          if ($LASTEXITCODE -ne 0) { throw 'Installer payload extraction failed' }
          $inputs = @{
            'harbor.exe' = "$releaseRoot/harbor.exe"
            'libmpv-2.dll' = 'src-tauri/libmpv/libmpv-2.dll'
            'mpv.exe' = 'src-tauri/binaries/mpv-x86_64-pc-windows-msvc.exe'
            'ffmpeg.exe' = 'src-tauri/binaries/ffmpeg-x86_64-pc-windows-msvc.exe'
            'ffprobe.exe' = 'src-tauri/binaries/ffprobe-x86_64-pc-windows-msvc.exe'
            'yt-dlp.exe' = 'src-tauri/binaries/yt-dlp-x86_64-pc-windows-msvc.exe'
          }
          foreach ($name in $inputs.Keys) {
            $matches = @(Get-ChildItem $extracted -Recurse -File | Where-Object Name -eq $name)
            $expectedHash = (Get-FileHash $inputs[$name] -Algorithm SHA256).Hash
            if (-not ($matches | Where-Object { (Get-FileHash $_.FullName -Algorithm SHA256).Hash -eq $expectedHash })) {
              $payloadNames = ((Get-ChildItem $extracted -Recurse -File).Name -join ', ')
              Write-Host "::error title=Installer payload validation::Missing or stale: $name. Extracted files: $payloadNames"
              throw "Installer payload is missing or stale: $name"
            }
          }
          New-Item -ItemType Directory -Force artifacts | Out-Null
          $name = "Harbor_${version}_combined-custom-fixes_no-extension-runtime_x64-setup.exe"
          Copy-Item $installer.FullName "artifacts/$name"
          $hash = (Get-FileHash "artifacts/$name" -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  $name" | Set-Content artifacts/SHA256SUMS.txt
          @(
            "Harbor $version Windows x64 installer"
            "Application source commit: $(if ($env:HARBOR_COMPILED_SOURCE) { $env:HARBOR_COMPILED_SOURCE } else { $env:GITHUB_SHA })"
            "Packaging workflow commit: $env:GITHUB_SHA"
            'Includes both uploaded custom branches: cloud-settings sync, Hungarian localization, preferred metadata, player/subtitle/HDR reliability, playback statistics, and settings/performance controls.'
            'New upstream strings without Hungarian translations retain the English fallback.'
            'libmpv is reused from the checksum-verified previous installer and also checked against the official asset digest; the repository downloader pin is unchanged.'
            'Android-extension runtime is not included, matching the previous cloud-sync installer.'
            'The installer is not digitally signed. Installation and live playback are not tested by this build.'
          ) | Set-Content artifacts/BUILD-NOTES.txt
          "## Verified Windows installer`n`nVersion: $version`n`nSource: $env:GITHUB_SHA`n`nSHA-256: $hash`n`nAndroid-extension runtime: not included." | Add-Content $env:GITHUB_STEP_SUMMARY
          Write-Host "::notice title=Verified installer::Version $version; source $env:GITHUB_SHA; SHA-256 $hash; no Android-extension runtime."

      - name: Upload verified Windows installer
        uses: actions/upload-artifact@v4
        with:
          name: harbor-windows-x64-installer
          path: artifacts/*
          if-no-files-found: error
          retention-days: 14
